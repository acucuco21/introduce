<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김동민의 자기소개</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: linear-gradient(155deg, #e0fcff 0%, #cff4fc 38%, #dbeeff 75%, #eef8ff 100%);
      background-attachment: fixed;
    }

    body {
      margin: 0 auto;
      max-width: 680px;
      padding: 36px 20px 56px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #164e63;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    hr {
      display: none;
    }

    header {
      background: linear-gradient(135deg, #a5f3fc 0%, #bae6fd 55%, #93c5fd 100%);
      border-radius: 24px;
      padding: 36px 28px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 14px 32px rgba(14, 116, 144, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #083344;
    }

    header p {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 500;
      color: #0e7490;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    main section {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(244, 251, 255, 0.92) 100%);
      border-radius: 22px;
      padding: 26px 28px;
      border: 1px solid rgba(125, 211, 252, 0.45);
      box-shadow:
        0 10px 26px rgba(14, 165, 233, 0.1),
        0 2px 6px rgba(8, 145, 178, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    main section:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 32px rgba(14, 165, 233, 0.15),
        0 4px 10px rgba(8, 145, 178, 0.08);
    }

    section h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #0c4a6e;
      letter-spacing: -0.01em;
    }

    section h2::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, #22d3ee 0%, #38bdf8 100%);
      flex-shrink: 0;
    }

    figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    figure img {
      display: block;
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 20px;
      border: 4px solid #e0f7fa;
      box-shadow: 0 10px 26px rgba(8, 145, 178, 0.18);
    }

    figcaption {
      margin-top: 14px;
      padding: 6px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #e0f7fa 0%, #e0f2fe 100%);
      color: #0e7490;
      font-size: 0.92rem;
      font-weight: 600;
      border: 1px solid rgba(103, 232, 249, 0.5);
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 10px 12px;
      align-items: center;
    }

    dt {
      background: linear-gradient(135deg, #cffafe 0%, #bae6fd 100%);
      color: #0e7490;
      padding: 10px 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.94rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    dd {
      margin: 0;
      background: #f0f9ff;
      color: #0c4a6e;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.98rem;
      border: 1px solid rgba(186, 230, 253, 0.65);
    }

    section p {
      margin: 0;
      color: #1e3a5f;
      font-size: 0.98rem;
      line-height: 1.75;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    li {
      background: linear-gradient(135deg, #cffafe 0%, #dbeafe 100%);
      color: #0369a1;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid rgba(125, 211, 252, 0.6);
      box-shadow:
        0 4px 12px rgba(56, 189, 248, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    footer {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      padding: 16px 22px;
      text-align: center;
      border: 1px solid rgba(186, 230, 253, 0.55);
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.08);
    }

    footer p {
      margin: 0;
      color: #0e7490;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 14px 36px;
      }

      header {
        padding: 28px 20px;
        border-radius: 20px;
        margin-bottom: 14px;
      }

      header h1 {
        font-size: 1.5rem;
      }

      header p {
        font-size: 0.95rem;
      }

      main {
        gap: 14px;
      }

      main section {
        padding: 22px 18px;
        border-radius: 18px;
      }

      section h2 {
        font-size: 1.12rem;
        margin-bottom: 14px;
      }

      dl {
        grid-template-columns: 88px 1fr;
        gap: 8px 10px;
      }

      dt,
      dd {
        padding: 9px 12px;
        font-size: 0.92rem;
      }

      li {
        padding: 8px 16px;
        font-size: 0.9rem;
      }

      footer {
        margin-top: 14px;
        border-radius: 16px;
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>안녕하세요! 김동민입니다.</h1>
    <p>친구들에게 저를 소개하기 위해 만든 공간입니다.</p>
    <hr>
  </header>

  <main>
    <section>
      <h2>내 사진</h2>
      <figure>
        <img src="photo.jpg" alt="김동민의 프로필 사진" width="300">
        <figcaption>김동민</figcaption>
      </figure>
    </section>

    <hr>

    <section>
      <h2>기본 정보</h2>
      <dl>
        <dt><strong>이름</strong></dt>
        <dd>김동민</dd>

        <dt><strong>MBTI</strong></dt>
        <dd>INFP</dd>

        <dt><strong>꿈</strong></dt>
        <dd>행복한 사람</dd>
      </dl>
    </section>

    <hr>

    <section>
      <h2>좋아하는 것</h2>
      <p>맛있는 음식을 먹는 걸 정말 좋아합니다. 특히 아래 세 가지를 가장 좋아해요!</p>
      <ul>
        <li>육회</li>
        <li>연어회</li>
        <li>참치회</li>
      </ul>
    </section>

    <hr>

    <section>
      <h2>친구들에게 한마디</h2>
      <p>
        다들 오늘도 좋은 하루 보내고 있나요? 맛있는 육회나 회 먹고 싶을 때 언제든 연락해 주세요!
        앞으로도 같이 즐겁고 행복한 시간 많이 보내요.
      </p>
    </section>
  </main>

  <footer>
    <hr>
    <p><small>작성자: 김동민</small></p>
  </footer>
</body>
</html>
