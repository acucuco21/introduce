<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김동민의 자기소개 - 목차</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0 auto;
      max-width: 680px;
      padding: 36px 20px 56px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #164e63;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      transition: color 0.7s ease;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
    }

    .bg-light {
      background: linear-gradient(155deg, #e0fcff 0%, #cff4fc 38%, #dbeeff 75%, #eef8ff 100%);
    }

    .bg-dark {
      background: linear-gradient(160deg, #070b14 0%, #0d1526 45%, #111c33 80%, #162238 100%);
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.dark .bg-dark {
      opacity: 1;
    }

    .bottom-glow {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 55vh;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 75% 48% at 50% 105%, rgba(255, 255, 255, 0.22) 0%, rgba(235, 248, 255, 0.1) 38%, rgba(200, 230, 255, 0.03) 62%, transparent 82%),
        linear-gradient(to top, rgba(255, 255, 255, 0.08) 0%, transparent 45%);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 1s ease, transform 1s ease;
    }

    body.dark .bottom-glow {
      opacity: 1;
      transform: translateY(0);
    }

    /* 다크모드 스위치 */
    .theme-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 14px;
    }

    .sky-toggle {
      position: relative;
      width: 98px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      background: linear-gradient(180deg, #4ba3e3 0%, #74c0f5 100%);
      box-shadow:
        0 4px 12px rgba(14, 116, 144, 0.22),
        inset 0 3px 7px rgba(0, 40, 80, 0.28),
        0 0 0 3px rgba(174, 226, 255, 0.85);
      transition: background 0.6s ease, box-shadow 0.6s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .sky-toggle:active {
      transform: scale(0.96);
    }

    body.dark .sky-toggle {
      background: linear-gradient(180deg, #1b2232 0%, #2f3a4f 100%);
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.5),
        inset 0 3px 8px rgba(0, 0, 0, 0.65),
        0 0 0 3px rgba(130, 145, 168, 0.55);
    }

    .sky-toggle__night-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #171e2c 0%, #2c374c 100%);
      opacity: 0;
      transition: opacity 0.65s ease;
      pointer-events: none;
    }

    body.dark .sky-toggle__night-bg {
      opacity: 1;
    }

    .sky-toggle__clouds {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1), filter 0.65s ease;
    }

    body.dark .sky-toggle__clouds {
      filter: brightness(0.48) saturate(0.25);
      transform: translateX(-6px);
    }

    .sky-toggle__stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px) scale(0.9);
      transition: opacity 0.65s ease 0.1s, transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s;
    }

    body.dark .sky-toggle__stars {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .sky-toggle__orb {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffe96b 0%, #ffd426 65%, #f5b800 100%);
      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.25),
        0 0 10px rgba(255, 221, 64, 0.65),
        inset -2px -2px 4px rgba(200, 130, 0, 0.25);
      transition: transform 0.6s cubic-bezier(0.34, 1.45, 0.64, 1), background 0.6s ease, box-shadow 0.6s ease;
      z-index: 2;
      overflow: hidden;
    }

    body.dark .sky-toggle__orb {
      transform: translateX(54px);
      background: radial-gradient(circle at 35% 35%, #eef2f7 0%, #cfd8e3 70%, #b0bccb 100%);
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.45),
        0 0 10px rgba(226, 232, 240, 0.35),
        inset -3px -3px 5px rgba(100, 116, 139, 0.35);
    }

    .crater {
      position: absolute;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.55);
      box-shadow: inset 1px 1px 2px rgba(71, 85, 105, 0.4);
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    body.dark .crater {
      opacity: 1;
      transform: scale(1);
    }

    .crater-1 { width: 8px; height: 8px; top: 8px; left: 10px; }
    .crater-2 { width: 5px; height: 5px; top: 19px; left: 7px; }
    .crater-3 { width: 6px; height: 6px; top: 16px; left: 19px; }

    /* 헤더 */
    header {
      background: linear-gradient(135deg, #a5f3fc 0%, #bae6fd 55%, #93c5fd 100%);
      border-radius: 24px;
      padding: 36px 28px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 14px 32px rgba(14, 116, 144, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      transition: background 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease;
    }

    body.dark header {
      background: linear-gradient(135deg, rgba(22, 42, 69, 0.92) 0%, rgba(28, 52, 84, 0.9) 55%, rgba(20, 38, 64, 0.94) 100%);
      border-color: rgba(125, 211, 252, 0.22);
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(186, 230, 253, 0.15);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #083344;
      transition: color 0.7s ease;
    }

    body.dark header h1 {
      color: #e0f7fa;
    }

    header p {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 500;
      color: #0e7490;
      transition: color 0.7s ease;
    }

    body.dark header p {
      color: #93c5fd;
    }

    /* 목차 카드 */
    .index-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(244, 251, 255, 0.92) 100%);
      border-radius: 22px;
      padding: 26px 28px;
      border: 1px solid rgba(125, 211, 252, 0.45);
      box-shadow:
        0 10px 26px rgba(14, 165, 233, 0.1),
        0 2px 6px rgba(8, 145, 178, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: background 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease;
    }

    body.dark .index-card {
      background: linear-gradient(180deg, rgba(20, 30, 48, 0.88) 0%, rgba(16, 24, 40, 0.9) 100%);
      border-color: rgba(125, 211, 252, 0.18);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #0c4a6e;
      letter-spacing: -0.01em;
      transition: color 0.7s ease;
    }

    body.dark .section-title {
      color: #bae6fd;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, #22d3ee 0%, #38bdf8 100%);
      flex-shrink: 0;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 18px;
      text-decoration: none;
      background: linear-gradient(135deg, #f0fdfa 0%, #f0f9ff 100%);
      border: 1px solid rgba(125, 211, 252, 0.55);
      box-shadow:
        0 6px 16px rgba(14, 165, 233, 0.09),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      transition: transform 0.18s ease, box-shadow 0.25s ease, background 0.6s ease, border-color 0.6s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 22px rgba(14, 165, 233, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      border-color: #38bdf8;
    }

    .nav-btn:active {
      transform: scale(0.985);
    }

    body.dark .nav-btn {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(23, 37, 64, 0.78) 100%);
      border-color: rgba(125, 211, 252, 0.22);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    body.dark .nav-btn:hover {
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45), 0 0 14px rgba(56, 189, 248, 0.14);
    }

    .nav-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .nav-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      background: linear-gradient(135deg, #cffafe 0%, #bae6fd 100%);
      color: #0e7490;
    }

    body.dark .nav-badge {
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.5) 0%, rgba(2, 132, 199, 0.45) 100%);
      color: #a5f3fc;
    }

    .nav-name {
      font-size: 1.06rem;
      font-weight: 800;
      color: #0c4a6e;
      transition: color 0.7s ease;
    }

    body.dark .nav-name {
      color: #e0f2fe;
    }

    .nav-desc {
      margin: 0;
      font-size: 0.88rem;
      color: #475569;
      line-height: 1.5;
      transition: color 0.7s ease;
    }

    body.dark .nav-desc {
      color: #94a3b8;
    }

    .nav-go {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    footer {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      padding: 16px 22px;
      text-align: center;
      border: 1px solid rgba(186, 230, 253, 0.55);
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.08);
      transition: background 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease;
    }

    body.dark footer {
      background: rgba(15, 23, 42, 0.75);
      border-color: rgba(125, 211, 252, 0.16);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    footer p {
      margin: 0;
      color: #0e7490;
      font-weight: 600;
      transition: color 0.7s ease;
    }

    body.dark footer p {
      color: #7dd3fc;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 14px 36px;
      }

      header {
        padding: 28px 20px;
        border-radius: 20px;
        margin-bottom: 14px;
      }

      header h1 {
        font-size: 1.48rem;
      }

      header p {
        font-size: 0.94rem;
      }

      .index-card {
        padding: 22px 18px;
        border-radius: 18px;
      }

      .section-title {
        font-size: 1.12rem;
        margin-bottom: 14px;
      }

      .nav-btn {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 16px;
        border-radius: 16px;
      }

      .nav-go {
        text-align: center;
        width: 100%;
      }

      footer {
        margin-top: 14px;
        border-radius: 16px;
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer bg-light" aria-hidden="true"></div>
  <div class="bg-layer bg-dark" aria-hidden="true"></div>
  <div class="bottom-glow" aria-hidden="true"></div>

  <div class="theme-bar">
    <button
      type="button"
      class="sky-toggle"
      id="themeToggle"
      aria-label="다크모드 전환"
      aria-pressed="false"
    >
      <span class="sky-toggle__night-bg" aria-hidden="true"></span>
      <svg class="sky-toggle__stars" viewBox="0 0 98 44" width="98" height="44" aria-hidden="true">
        <path d="M18 9l1.1 2.4 2.6.4-1.9 1.8.4 2.6-2.2-1.2-2.2 1.2.4-2.6-1.9-1.8 2.6-.4z" fill="#e2e8f0" />
        <circle cx="31" cy="14" r="1.3" fill="#cbd5e1" />
        <path d="M43 8l0.9 1.9 2.1.3-1.5 1.5.4 2.1-1.9-1-1.9 1 .4-2.1-1.5-1.5 2.1-.3z" fill="#f1f5f9" />
        <circle cx="24" cy="24" r="1.1" fill="#e2e8f0" />
        <circle cx="52" cy="18" r="1.2" fill="#cbd5e1" />
      </svg>
      <svg class="sky-toggle__clouds" viewBox="0 0 98 44" width="98" height="44" aria-hidden="true">
        <g fill="#ffffff" opacity="0.92">
          <circle cx="48" cy="11" r="4" />
          <circle cx="53" cy="11" r="3.2" />
          <circle cx="44" cy="12" r="3" />
          <circle cx="72" cy="12" r="4.2" />
          <circle cx="77" cy="13" r="3.2" />
          <circle cx="68" cy="13" r="3" />
        </g>
        <g fill="#f1f5f9" opacity="0.96">
          <circle cx="26" cy="40" r="8" />
          <circle cx="37" cy="38" r="9" />
          <circle cx="49" cy="36" r="10" />
          <circle cx="62" cy="37" r="9" />
          <circle cx="74" cy="35" r="10" />
          <circle cx="85" cy="32" r="8" />
          <circle cx="92" cy="36" r="7" />
        </g>
      </svg>
      <span class="sky-toggle__orb" aria-hidden="true">
        <span class="crater crater-1"></span>
        <span class="crater crater-2"></span>
        <span class="crater crater-3"></span>
      </span>
    </button>
  </div>

  <header>
    <h1>김동민의 자기소개 목차</h1>
    <p>단계별로 발전한 자기소개 웹페이지들을 한눈에 모아봤어요.</p>
  </header>

  <main>
    <section class="index-card">
      <h2 class="section-title">페이지 목록</h2>
      <div class="nav-list">
        <a class="nav-btn" href="1-html.html">
          <div class="nav-info">
            <div class="nav-top">
              <span class="nav-badge">STEP 1</span>
              <span class="nav-name">1-html.html</span>
            </div>
            <p class="nav-desc">CSS와 JavaScript 없이 순수 HTML 태그만으로 구성한 기본 자기소개 페이지</p>
          </div>
          <span class="nav-go">열기 →</span>
        </a>

        <a class="nav-btn" href="2-css.html">
          <div class="nav-info">
            <div class="nav-top">
              <span class="nav-badge">STEP 2</span>
              <span class="nav-name">2-css.html</span>
            </div>
            <p class="nav-desc">파스텔 시안·하늘색 그라데이션과 둥근 카드 디자인을 입힌 반응형 페이지</p>
          </div>
          <span class="nav-go">열기 →</span>
        </a>

        <a class="nav-btn" href="3-js.html">
          <div class="nav-info">
            <div class="nav-top">
              <span class="nav-badge">STEP 3</span>
              <span class="nav-name">3-js.html</span>
            </div>
            <p class="nav-desc">다크모드 스위치, 좋아요 이펙트, 방명록, 5종 미니게임(지뢰찾기·팝잇·그림판·팩맨·마법 뿅뿅) 포함 완성본</p>
          </div>
          <span class="nav-go">열기 →</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p><small>작성자: 김동민</small></p>
  </footer>

  <script>
    (function () {
      const THEME_KEY = "dongmin_theme_v1";
      const themeToggle = document.getElementById("themeToggle");

      function applyTheme(isDark) {
        document.body.classList.toggle("dark", isDark);
        themeToggle.setAttribute("aria-pressed", String(isDark));
      }

      applyTheme(localStorage.getItem(THEME_KEY) === "dark");

      themeToggle.addEventListener("click", function () {
        const isDark = !document.body.classList.contains("dark");
        applyTheme(isDark);
        localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
      });
    })();
  </script>
</body>
</html>
